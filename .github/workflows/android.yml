name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish/update rolling release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "GoIt - Latest Debug Build"
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            Automatic debug build of the GoIt Bursa transit app.

            - Tab 1 "Yol Tarifi": A-to-B trip planning (search a place, resolve nearest stop, route alternatives incl. 1-transfer)
            - Tab 2 "Duraklar": nearby stops with live ETA minutes and card prices
            - Tab 3 "Hatlar": full route catalog (409 lines), recently used on top, live vehicles per stop, "Sen burdasın" tag
            - Dark theme, MapLibre 11.13.5 (16 KB page-size compliant)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
