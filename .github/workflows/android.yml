name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The standalone "tools" package no longer exists in the SDK repo
          # (replaced by cmdline-tools), so only install platform-tools here.
          packages: "platform-tools"

      - name: Install required SDK components
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "build-tools;35.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify 16 KB page-size alignment
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/35.0.0 | head -1)
          echo "Using build-tools: $BT"
          # ELF segment check for 64-bit ABIs
          "$BT/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish/update rolling release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "GoIt - Latest Debug Build"
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            GoIt Bursa Transit v1.2.0

            - Moovit-style place-to-place trip flow (origin & destination are POIs/venues; stops resolved only at plan time)
            - Manual "Rota Bul" trigger on destination selection (no unexpected auto-planning)
            - "Konumumu kullan" GPS button on origin selection
            - Staged legs summary ("6 dk yürü → 38 (12 durak) → 4 dk yürü") with walking legs (access, transfer, egress)
            - Direct routes strictly ranked above transfers; "Sadece yürü" option for distances <= 2 km
            - Map draws ONLY the selected plan (dashed walking legs, blue 1st bus, orange 2nd bus, transfer point marker)
            - Routes tab: live ETAs for nearest stop on top (~15 s loop), favorites, recent, and collapsible "Tüm Hatlar (409)" catalog
            - Google Maps link integration: open links/coordinates directly from external apps or paste into search box
            - 16 KB page-size verified (MapLibre 11.13.5, AGP 8.5.2)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
