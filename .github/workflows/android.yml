name: Build APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install required SDK components
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "build-tools;35.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare signing keystore
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p /tmp/ks
          echo "$KS_B64" | base64 -d > /tmp/ks/debug.keystore

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        env:
          GOIT_KEYSTORE_PATH: /tmp/ks/debug.keystore
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify 16 KB page-size alignment
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/35.0.0 | head -1)
          echo "Using build-tools: $BT"
          "$BT/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk

      - name: Verify keystore signature
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/35.0.0 | head -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tr -d ':' | grep -i "ded8686154fc2cc0c170b87bb5f3d6a0c75ab207"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish "latest" prerelease APK
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SHORT_SHA=$(git rev-parse --short HEAD)
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "GoIt latest" \
              --notes "Rolling pre-release built from master (${SHORT_SHA})." \
              --prerelease
          fi
          gh release upload latest "$APK" --clobber
          gh release edit latest --notes "Rolling pre-release built from master (${SHORT_SHA})."

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "GoIt $TAG" --notes "Signed debug APK for $TAG."
          gh release upload "$TAG" "$APK" --clobber


