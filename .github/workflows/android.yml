name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The standalone "tools" package no longer exists in the SDK repo
          # (replaced by cmdline-tools), so only install platform-tools here.
          packages: "platform-tools"

      - name: Install required SDK components
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "build-tools;35.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify 16 KB page-size alignment
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/35.0.0 | head -1)
          echo "Using build-tools: $BT"
          # ELF segment check for 64-bit ABIs
          "$BT/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish/update rolling release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "GoIt - Latest Debug Build"
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            GoIt Bursa Transit v1.3.0

            - Live Directions Journey Mode: staged walking/waiting/riding guidance with live stop counting, ETA polling, and alight alerts
            - Google Maps Link Resolution: share or paste Google Maps links/places to resolve coordinates via embed lookup and CID decoding
            - First-Run Onboarding: permission guide and comprehensive tab tour on initial launch
            - Vehicle Amenity Badges: air conditioner (AC) and wheelchair accessibility indicators on live boards and stops
            - Saved Places & History: Home/Work shortcuts, bookmarked places, and recent journey history
            - Route Sorting Options: filter alternatives by Recommended, Fastest, Least Walking, and Least Transfers
            - Settings Screen: customizable walking distance limits (access & transfer) and saved places manager
            - Single "Sen burdasın" badge: guaranteed single nearest-stop indicator on stops and route timeline
            - Distance-based bus durations with live board ETAs and arrival times
            - 16 KB page-size verified (MapLibre 11.13.5, AGP 8.5.2)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
