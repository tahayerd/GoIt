name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The standalone "tools" package no longer exists in the SDK repo
          # (replaced by cmdline-tools), so only install platform-tools here.
          packages: "platform-tools"

      - name: Install required SDK components
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "build-tools;35.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify 16 KB page-size alignment
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/35.0.0 | head -1)
          echo "Using build-tools: $BT"
          # ELF segment check for 64-bit ABIs
          "$BT/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish/update rolling release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "GoIt - Latest Debug Build"
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            GoIt Bursa Transit v1.4.0

            - Fully Automatic Journey Mode (Moovit-style): boarding is auto-detected from GPS speed and distance from stop - no manual confirmation
            - One-way stop counter: immune to GPS jitter, never counts backwards
            - Moovit-pattern live notifications: "line arriving in ~X min", "Arriving soon - 2 stops left", "Get ready - next stop is yours", arrival celebration
            - Redesigned journey overlay: alight-imminent warning banner, automatic detection badge, single End Trip action
            - Slow-traffic fallback boarding detection (congested streets)
            - (v1.3.0) Google Maps link resolution, onboarding, amenity badges, saved places, journey history, sort chips, settings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
