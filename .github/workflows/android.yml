name: Build APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install required SDK components
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "build-tools;35.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify 16 KB page-size alignment
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/35.0.0 | head -1)
          echo "Using build-tools: $BT"
          "$BT/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish versioned release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "GoIt ${{ github.ref_name }}"
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            GoIt Bursa Transit ${{ github.ref_name }}

            - Trip Tab Focus & Auto-Collapse: tapping search collapses route alternatives; tapping alternatives collapses search to single-line summary
            - Right-Aligned Route Alternative ETAs: all routes show estimated arrival countdown on the right (live GPS or scheduled timetable fallback)
            - Clean Journey Mode Layout: search card and alternatives automatically hide when journey begins; HUD fits seamlessly above navigation bar
            - Comprehensive Live HUD: live bus arrival countdown while waiting, expandable route stop list (passed/current/upcoming) with time-to-destination estimation, walk distance & minutes
            - Pure AMOLED Dark Theme: true `#000000` background option in Settings for battery savings and high contrast
            - Clean Professional UI: all emojis replaced with sharp Material Design icons
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish/update rolling latest release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "GoIt - Latest Debug Build"
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            GoIt Bursa Transit v1.5.0

            - Trip Tab Focus & Auto-Collapse: tapping search collapses route alternatives; tapping alternatives collapses search to single-line summary
            - Right-Aligned Route Alternative ETAs: all routes show estimated arrival countdown on the right (live GPS or scheduled timetable fallback)
            - Clean Journey Mode Layout: search card and alternatives automatically hide when journey begins; HUD fits seamlessly above navigation bar
            - Comprehensive Live HUD: live bus arrival countdown while waiting, expandable route stop list (passed/current/upcoming) with time-to-destination estimation, walk distance & minutes
            - Pure AMOLED Dark Theme: true `#000000` background option in Settings for battery savings and high contrast
            - Clean Professional UI: all emojis replaced with sharp Material Design icons
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
