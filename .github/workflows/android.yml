name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install required SDK components
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "build-tools;35.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare signing keystore
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p /tmp/ks
          echo "$KS_B64" | base64 -d > /tmp/ks/debug.keystore

      - name: Build debug APK
        env:
          GOIT_KEYSTORE_PATH: /tmp/ks/debug.keystore
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify 16 KB page-size alignment
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/35.0.0 | head -1)
          echo "Using build-tools: $BT"
          "$BT/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk

      - name: Verify keystore signature
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/35.0.0 | head -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tr -d ':' | grep -i "ded8686154fc2cc0c170b87bb5f3d6a0c75ab207"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish/update rolling release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "GoIt - Latest Debug Build"
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            GoIt Bursa Transit v1.6.0

            - Schedule Data Pipeline: daily CI timetable crawl + offline on-device chunked schedule cache
            - Road-Snapped Bus & Walking Routes: snap-to-polyline for live buses, clipped route shapes for planned bus legs, OSRM foot routing for walking legs
            - Expandable Bus Detail: comprehensive stop progression timeline, fare selection (Standard/Discount/Student), upcoming runs list, estimated arrival time
            - Continuous Refined Location: smooth live user location marker with white ring & soft drop shadow, battery-efficient lifecycle observer
            - Enhanced Panel Gestures: vertical drag to expand/collapse, clean headers, auto-collapse on map drag gestures with instant restoration
            - Fluid Tab Switching: spring-animated tab swipes across designated panels and navigation bar
            - Dual-Tone Route Visualization: pastel full line overview, solid traveled segment, muted remaining segment
            - Compact Origin/Destination Picker: single-line inputs with location shortcut, saved places and frequently visited chips
            - Stable Signing: signed with reproducible fixed keystore for seamless version upgrades without uninstallation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
